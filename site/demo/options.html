<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Options Demo</title>
<script>
// O painel real do Trail em modo demonstração, fora da extensão: stub mínimo das APIs do Chrome.
// Tema e idioma vêm da URL (?theme=dark|light, ?lang=pt|en); nada é gravado, nada sai daqui.
(() => {
  const noop = () => {};
  const ev = { addListener: noop, removeListener: noop };
  const none = () => Promise.resolve({});
  window.chrome = {
    runtime: { sendMessage: () => Promise.resolve(), getURL: (p) => p, onMessage: ev, openOptionsPage: noop },
    storage: { sync: { get: none, set: none }, session: { get: none, set: none }, local: { get: none, set: none }, onChanged: ev },
    tabs: { query: () => Promise.resolve([]), onActivated: ev, onUpdated: ev },
    permissions: { request: () => Promise.resolve(true), remove: () => Promise.resolve(true), contains: () => Promise.resolve(true) },
  };
  const q = new URLSearchParams(location.search);
  if (!q.has('demo')) { q.set('demo', '1'); history.replaceState(null, '', '?' + q); }
  document.documentElement.dataset.theme = q.get('theme') === 'light' ? 'light' : 'dark';

})();
</script>
